[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-mlp-from-scratch"
version = "0.1.0"
description = "A pure NumPy multilayer perceptron for MNIST"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3.0",
    "streamlit>=1.40,<2.0",
    "plotly>=5.24,<7.0",
    "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.18,<3.0",
    "scikit-learn>=1.5,<2.0",
    "jupyterlab>=4.2,<5.0",
    "ipykernel>=6.29,<7.0",
    "matplotlib>=3.9,<4.0",
]
dev = [
    "pytest>=8.3,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]